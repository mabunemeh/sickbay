name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows proves the path encoding and the byte-exact checkout.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fixtures are stored with LF and untouched (no crlf in the index)
        shell: bash
        run: |
          git ls-files --eol incidents tests/fixtures
          if git ls-files --eol incidents tests/fixtures | grep -E 'i/(crlf|mixed)'; then
            echo "snapshot or fixture files have CRLF in the index" >&2
            exit 1
          fi

      - name: Lint (ruff check)
        run: ruff check .

      - name: Lint (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test
        run: pytest
