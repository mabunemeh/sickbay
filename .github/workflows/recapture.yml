name: Recapture

# Re-injects each incident on a real systemd runner and checks that the evidence
# tests still hold against the fresh capture. The committed snapshots stay the
# benchmark input; this job only detects drift.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  recapture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        incident: [fd-exhaustion, memory-ceiling-parent-slice, restart-loop]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Inject and capture
        run: |
          SICKBAY_BIN="$(command -v sickbay)" scripts/reproduce.sh \
            "${{ matrix.incident }}" "$RUNNER_TEMP/snap/${{ matrix.incident }}"

      - name: Evidence tests against the fresh capture
        env:
          SICKBAY_SNAPSHOT_ROOT: ${{ runner.temp }}/snap
        run: |
          SICKBAY_REAL_USER="$(id -un)" SICKBAY_REAL_HOST="$(hostname)" \
            pytest tests/test_incidents.py --no-cov

      - name: Show where leak strings occur (on failure)
        if: failure()
        env:
          SNAP: ${{ runner.temp }}/snap/${{ matrix.incident }}
          WORDS: ${{ matrix.incident }}
        run: |
          WORDS="$WORDS inject cleanup.sh incidents/ $(id -un) $(hostname)" python - <<'EOF'
          import json, os, pathlib
          snap = pathlib.Path(os.environ["SNAP"])
          words = [w.lower() for w in os.environ["WORDS"].split()]
          for line in (snap / "journal.jsonl").read_text(errors="replace").splitlines():
              e = json.loads(line)
              for k, v in e.items():
                  s = str(v).lower()
                  for w in words:
                      i = s.find(w)
                      if i >= 0:
                          print(w, "|", e.get("syslog_identifier") or e.get("SYSLOG_IDENTIFIER"),
                                "|", e.get("_systemd_unit") or e.get("_SYSTEMD_UNIT"), "|", k,
                                "|", s[max(0, i - 80):i + 80])
          for p in snap.rglob("*"):
              if p.is_file() and p.name != "journal.jsonl":
                  b = p.read_bytes().lower()
                  for w in words:
                      if w.encode() in b:
                          print("file:", p.relative_to(snap), "contains", w)
                          for ln in b.splitlines():
                              if w.encode() in ln:
                                  print("   ", ln[:200].decode(errors="replace"))
          EOF

      - name: Cleanup
        if: always()
        run: sudo "incidents/${{ matrix.incident }}/cleanup.sh"
